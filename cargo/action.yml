name: 'Update Cargo Dependencies'

description: 'Update Rust toolchain version and Cargo dependencies'

inputs:
  token:
    required: false
    description: 'GitHub token'
    default: ${{ github.token }}

  base-branch:
    required: true
    description: 'Base branch for the pull request'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-dependencies'

  pr-title:
    required: false
    description: 'Title of the pull request'
    default: 'Update Cargo Dependencies'

  commit-message:
    required: false
    description: 'Commit message for the update'
    default: 'Update Cargo dependencies'

  app-slug:
    required: false
    description: 'GitHub App slug for commit attribution. When set, Git uses the app bot identity.'
    default: ''

  auto-merge:
    required: false
    description: 'Enable automatic merge for a successful pull request'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method for automatic merging. Use merge, squash, or rebase.'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Do not create a pull request when an open pull request with this title exists on the base branch.'
    default: 'false'

  update-toolchain:
    required: false
    description: 'Update the Rust toolchain version'
    default: 'true'

  update-deps:
    required: false
    description: 'Update Cargo dependencies'
    default: 'true'

  keep-build-metadata:
    required: false
    description: "Preserve SemVer build metadata, the '+...' suffix, in updated version requirements."
    default: 'false'

  dry-run:
    required: false
    description: 'Test mode updates a pre-checked-out working tree. It does not check out or create a pull request.'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@v1
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Checkout and setup
      if: inputs.dry-run != 'true'
      uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
      with:
        token: ${{ inputs.token }}
        app-slug: ${{ inputs.app-slug }}

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.dry-run != 'true' && inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Read current Rust version
      if: steps.check_existing_pr.outputs.exists != 'true'
      id: current_version
      shell: bash
      run: |
        if [ ! -f rust-toolchain.toml ]; then
          echo "::error::rust-toolchain.toml not found. This file is required as the source of truth for the Rust version."
          exit 1
        fi
        version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "::notice::Rust toolchain version: $version"

        is_stable="false"
        if echo "$version" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          is_stable="true"
        fi
        echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"

        if [ "$is_stable" = "false" ]; then
          echo "::warning::Rust channel '$version' is not stable. Skip the toolchain update."
        fi

    - name: Setup Rust toolchain
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.current_version.outputs.version }}

    - name: Configure Cargo upgrade tooling
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: echo "CARGO_EDIT_VERSION=0.12.3" >> "$GITHUB_ENV"

    - name: Cache Cargo upgrade tooling
      id: cache-cargo-edit
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ci-tools/cargo-edit/${{ env.CARGO_EDIT_VERSION }}
          ~/.cargo/registry
          ~/.cargo/git
        key: v2-cargo-edit-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_EDIT_VERSION }}

    - name: Install Cargo upgrade tooling
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true' && steps.cache-cargo-edit.outputs.cache-hit != 'true'
      shell: bash
      run: |
        CARGO_EDIT_HOME="$HOME/.cache/ci-tools/cargo-edit/$CARGO_EDIT_VERSION"
        cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked \
          --root "$CARGO_EDIT_HOME" \
          --target-dir "$CARGO_EDIT_HOME/target"

    - name: Add Cargo upgrade tooling to PATH
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: echo "$HOME/.cache/ci-tools/cargo-edit/$CARGO_EDIT_VERSION/bin" >> "$GITHUB_PATH"

    - name: Get latest stable Rust version
      id: latest_version
      if: inputs.update-toolchain == 'true' && steps.current_version.outputs.is_stable == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        tag=$(gh api repos/rust-lang/rust/releases/latest --jq '.tag_name')
        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "::notice::Latest stable Rust version: $tag"
      env:
        GH_TOKEN: ${{ inputs.token }}

    - name: Update toolchain version
      id: toolchain_update
      if: inputs.update-toolchain == 'true' && steps.current_version.outputs.is_stable == 'true' && steps.current_version.outputs.version != steps.latest_version.outputs.version && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        old="${{ steps.current_version.outputs.version }}"
        new="${{ steps.latest_version.outputs.version }}"
        sed -i "s/channel = \"$old\"/channel = \"$new\"/" rust-toolchain.toml
        echo "updated=true" >> "$GITHUB_OUTPUT"
        echo "::notice::Updated Rust toolchain from $old to $new"

    - name: Discover Cargo.toml files
      id: discover
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        manifests_file="$RUNNER_TEMP/cargo-manifests"
        find . -name Cargo.toml -not -path '*/target/*' -print0 | sort -z > "$manifests_file"
        echo "manifests_file=$manifests_file" >> "$GITHUB_OUTPUT"
        echo "::notice::The action found $(tr -cd '\0' < "$manifests_file" | wc -c | tr -d ' ') Cargo manifests"

    - name: Update Cargo.toml dependencies
      id: update_deps
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        python3 "${{ github.action_path }}/scripts/update_cargo_deps.py" \
          ${{ inputs.keep-build-metadata == 'true' && '--keep-build-metadata' || '' }} \
          --manifests-file "${{ steps.discover.outputs.manifests_file }}"

    - name: Refresh Cargo.lock files
      if: inputs.update-deps == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        while IFS= read -r -d '' manifest; do
          cargo update --manifest-path "$manifest"
        done < "${{ steps.discover.outputs.manifests_file }}"

    - name: Collect modified files
      if: steps.check_existing_pr.outputs.exists != 'true'
      id: collect_files
      shell: bash
      run: |
        files="rust-toolchain.toml"

        if [ "${{ inputs.update-deps }}" = "true" ]; then
          while IFS= read -r -d '' manifest; do
            dir=$(dirname "$manifest")
            files+=" $manifest"
            if [ -f "$dir/Cargo.lock" ]; then
              files+=" $dir/Cargo.lock"
            fi
          done < "${{ steps.discover.outputs.manifests_file }}"
        fi

        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Build PR body
      if: steps.check_existing_pr.outputs.exists != 'true'
      id: build_pr_body
      shell: bash
      env:
        TOOLCHAIN_UPDATED: ${{ steps.toolchain_update.outputs.updated }}
        CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        LATEST_VERSION: ${{ steps.latest_version.outputs.version }}
        DEP_UPDATES: ${{ steps.update_deps.outputs.dep_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../shared/build_update_pr_body.py
      run: |
        preface_file="$RUNNER_TEMP/cargo-pr-preface.md"
        updates_file="$RUNNER_TEMP/cargo-updates.json"
        : > "$preface_file"
        printf "%s" "$DEP_UPDATES" | python3 -c '
        import json
        import sys

        json.dump(
            [line.split("\t") for line in sys.stdin.read().splitlines() if line],
            sys.stdout,
        )
        ' > "$updates_file"

        if [ "$TOOLCHAIN_UPDATED" = "true" ]; then
          {
            echo "## Rust Toolchain"
            echo
            echo "| | Version |"
            echo "| --- | --- |"
            echo "| **Previous** | \`$CURRENT_VERSION\` |"
            echo "| **Updated** | \`$LATEST_VERSION\` |"
          } > "$preface_file"
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# Cargo Dependencies Update" \
          --columns "Crate,Old,New,Manifest" \
          --updates-file "$updates_file" \
          --preface-file "$preface_file" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/cargo"

    - name: Check for changes
      id: check_changes
      if: inputs.dry-run != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/check-changes@v1
      with:
        files: ${{ steps.collect_files.outputs.files }}

    - name: Create Pull Request
      id: open-pr
      if: inputs.dry-run != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@v1
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: ${{ steps.collect_files.outputs.files }}
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ fromJSON(steps.build_pr_body.outputs.pr_body) }}

    - name: Auto-merge Pull Request
      if: inputs.dry-run != 'true' && inputs.auto-merge == 'true' && steps.open-pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@v1
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open-pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
