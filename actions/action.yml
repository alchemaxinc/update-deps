name: 'Update GitHub Actions'

description: 'Update GitHub Actions in .github workflow files.'

inputs:
  token:
    required: false
    description: 'GitHub token'
    default: ${{ github.token }}

  base-branch:
    required: true
    description: 'Base branch for the pull request'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-actions'

  pr-title:
    required: false
    description: 'Title of the pull request'
    default: 'Update GitHub Actions'

  commit-message:
    required: false
    description: 'Commit message for the update'
    default: 'Update GitHub Actions'

  file-glob:
    required: false
    description: 'Glob for workflow files, relative to the repository root'
    default: '.github/**/*.y*ml'

  check-files:
    required: false
    description: 'Path or glob for changed files in the pull request'
    default: '.github'

  excluded-actions:
    required: false
    description: 'Comma-separated action owners, repositories, or paths to exclude. Values are literal, not regular expressions.'
    default: ''

  app-slug:
    required: false
    description: 'GitHub App slug for commit attribution. When set, Git uses the app bot identity.'
    default: ''

  auto-merge:
    required: false
    description: 'Enable automatic merge for a successful pull request'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method for automatic merging. Use merge, squash, or rebase.'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Do not create a pull request when an open pull request with this title exists on the base branch.'
    default: 'false'

  dry-run:
    required: false
    description: 'Print planned updates. Do not modify files or create a pull request.'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@v1
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Checkout and setup
      if: inputs.dry-run != 'true'
      uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
      with:
        token: ${{ inputs.token }}
        app-slug: ${{ inputs.app-slug }}

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.dry-run != 'true' && inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Setup Python
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: actions/setup-python@v7
      env:
        PYTHON_VERSION: '3.14'
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: python -m pip install -r ${{ github.action_path }}/requirements.txt

    - name: Update action versions
      id: update_actions
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        python ${{ github.action_path }}/cli.py \
          --root "$GITHUB_WORKSPACE" \
          --file-glob "${{ inputs.file-glob }}" \
          --excluded-actions "${{ inputs.excluded-actions }}" \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

    - name: Build PR description
      id: build_pr_body
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        ACTION_UPDATES: ${{ steps.update_actions.outputs.action_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../shared/build_update_pr_body.py
      run: |
        updates_file="$RUNNER_TEMP/action-updates.json"
        printf "%s" "$ACTION_UPDATES" | python3 -c '
        import json
        import sys

        json.dump(
            [line.split("\t") for line in sys.stdin.read().splitlines() if line],
            sys.stdout,
        )
        ' > "$updates_file"

        python3 "$PR_BODY_SCRIPT" \
          --title "# GitHub Actions Update" \
          --columns "Action,Old,New" \
          --updates-file "$updates_file" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/actions"

    - name: Check for changes
      id: check_changes
      if: inputs.dry-run != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/check-changes@v1
      with:
        files: ${{ inputs.check-files }}

    - name: Create Pull Request
      id: open-pr
      if: inputs.dry-run != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@v1
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: ${{ inputs.check-files }}
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ fromJSON(steps.build_pr_body.outputs.pr_body) }}

    - name: Auto-merge Pull Request
      if: inputs.dry-run != 'true' && inputs.auto-merge == 'true' && steps.open-pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@v1
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open-pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
