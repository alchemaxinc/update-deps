name: 'Update pnpm Dependencies'

description: 'Update pnpm dependencies with pnpm update.'

inputs:
  token:
    required: false
    description: 'GitHub token'
    default: ${{ github.token }}

  base-branch:
    required: true
    description: 'Base branch for the pull request'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-dependencies'

  pr-title:
    required: false
    description: 'Title of the pull request'
    default: 'Update pnpm Dependencies'

  commit-message:
    required: false
    description: 'Commit message for the update'
    default: 'Update pnpm dependencies'

  excluded-packages:
    required: false
    description: 'Comma-separated packages to exclude from updates'

  relock:
    required: false
    description: 'Regenerate pnpm-lock.yaml when no package updates exist'
    default: 'false'

  app-slug:
    required: false
    description: 'GitHub App slug for commit attribution. When set, Git uses the app bot identity.'
    default: ''

  auto-merge:
    required: false
    description: 'Enable automatic merge for a successful pull request'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method for automatic merging. Use merge, squash, or rebase.'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Do not create a pull request when an open pull request with this title exists on the base branch.'
    default: 'false'

  dry-run:
    required: false
    description: 'Test mode updates a pre-checked-out working tree. It does not check out or create a pull request.'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@v1
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Checkout and setup
      if: inputs.dry-run != 'true'
      uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
      with:
        token: ${{ inputs.token }}
        app-slug: ${{ inputs.app-slug }}

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.dry-run != 'true' && inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Setup pnpm
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: actions/setup-node@v7
      with:
        cache: 'pnpm'
        node-version-file: '.nvmrc'

    - name: Snapshot current dependency ranges
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-before.json"

    - name: Update dependencies
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
        RELOCK: ${{ inputs.relock }}
      run: |
        args=()
        IFS=',' read -ra excluded <<< "$EXCLUDED_PACKAGES"
        for pkg in "${excluded[@]}"; do
          pkg=$(echo "$pkg" | xargs)
          [ -z "$pkg" ] && continue
          args+=("!$pkg")
        done

        if [ "${#args[@]}" -gt 0 ]; then
          pnpm update --latest --ignore-scripts '*' "${args[@]}"
        else
          pnpm update --latest --ignore-scripts
        fi

        if [ "$RELOCK" = "true" ]; then
          # Keep optional dependencies for other platforms. A lockfile from one
          # runner can omit these dependencies.
          pnpm install --ignore-scripts --no-frozen-lockfile
        fi

        pnpm install --ignore-scripts --frozen-lockfile

    - name: Collect update records
      id: collect_updates
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-after.json"

        updates_file="$RUNNER_TEMP/pnpm-updates.json"
        node - "$RUNNER_TEMP/pnpm-ranges-before.json" \
          "$RUNNER_TEMP/pnpm-ranges-after.json" > "$updates_file" <<'NODE'
        const fs = require("fs");
        const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
        const after = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
        const updates = Object.keys(before)
          .filter(name => Object.hasOwn(after, name) && after[name] !== before[name])
          .sort()
          .map(name => [name, before[name], after[name]]);
        process.stdout.write(JSON.stringify(updates));
        NODE

        node - "$updates_file" <<'NODE'
        const fs = require("fs");
        for (const [pkg, oldVersion, newVersion] of JSON.parse(fs.readFileSync(process.argv[2], "utf8"))) {
          console.log(`::notice::Updated ${pkg} from ${oldVersion} to ${newVersion}`);
        }
        NODE

        if [ "$(cat "$updates_file")" != "[]" ]; then
          echo "has_updates=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No package updates available"
        fi

    - name: Build PR description
      id: build_pr_body
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        HAS_UPDATES: ${{ steps.collect_updates.outputs.has_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../shared/build_update_pr_body.py
      run: |
        empty_message=""
        if [ "$HAS_UPDATES" != "true" ]; then
          empty_message="Regenerated \`pnpm-lock.yaml\`. No package versions changed."
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# pnpm Dependencies Update" \
          --columns "Package,Old,New" \
          --updates-file "$RUNNER_TEMP/pnpm-updates.json" \
          --empty-message "$empty_message" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/pnpm"

    - name: Determine files to commit
      id: files
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        files="package.json pnpm-lock.yaml"
        if [ -f pnpm-workspace.yaml ]; then
          files="$files pnpm-workspace.yaml"
        fi
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Check for changes
      id: check_changes
      if: inputs.dry-run != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/check-changes@v1
      with:
        files: ${{ steps.files.outputs.files }}

    - name: Create Pull Request
      id: open-pr
      if: inputs.dry-run != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@v1
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: ${{ steps.files.outputs.files }}
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ fromJSON(steps.build_pr_body.outputs.pr_body) }}

    - name: Auto-merge Pull Request
      if: inputs.dry-run != 'true' && inputs.auto-merge == 'true' && steps.open-pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@v1
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open-pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
