name: 'Update pnpm Dependencies'

description: 'Update pnpm dependencies using pnpm update'

inputs:
  token:
    required: false
    description: 'GitHub token'
    default: ${{ github.token }}

  base-branch:
    required: true
    description: 'Base branch for PR'
    default: 'main'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-dependencies'

  pr-title:
    required: false
    description: 'Title for the pull request'
    default: 'Update pnpm Dependencies'

  commit-message:
    required: false
    description: 'The commit message for the update'
    default: 'Update pnpm dependencies'

  excluded-packages:
    required: false
    description: 'Packages to exclude from updates, in a comma-separated list format'

  relock:
    required: false
    description: 'Whether pnpm-lock.yaml should be regenerated, even if no other updates are available'
    default: 'false'

  app-slug:
    required: false
    description: 'GitHub App slug for commit attribution (e.g., my-app). If provided, configures git as the app bot'
    default: ''

  auto-merge:
    required: false
    description: 'Whether a successful PR should be automatically merged'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method to use when auto-merging the PR. Must be one of: merge, squash, rebase. Used when auto-merge is enabled.'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Skip creating a new PR if an open PR with the same title already exists on the base branch'
    default: 'false'

  dry-run:
    required: false
    description: 'Run without creating a PR (for testing purposes)'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@v1
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Checkout and setup
      if: inputs.dry-run != 'true'
      uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
      with:
        token: ${{ inputs.token }}
        app-slug: ${{ inputs.app-slug }}

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.dry-run != 'true' && inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Setup pnpm
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: actions/setup-node@v7
      with:
        cache: 'pnpm'
        node-version-file: '.nvmrc'

    - name: Snapshot current dependency ranges
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-before.json"

    - name: Update dependencies
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
        RELOCK: ${{ inputs.relock }}
      run: |
        args=()
        IFS=',' read -ra excluded <<< "$EXCLUDED_PACKAGES"
        for pkg in "${excluded[@]}"; do
          pkg=$(echo "$pkg" | xargs)
          [ -z "$pkg" ] && continue
          args+=("!$pkg")
        done

        if [ "${#args[@]}" -gt 0 ]; then
          pnpm update --latest '*' "${args[@]}"
        else
          pnpm update --latest
        fi

        if [ "$RELOCK" = "true" ]; then
          # Rebuild only after updating: deleting the lockfile before applying
          # exclusions can resolve excluded packages outside their manifest ranges.
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile --lockfile-only
        fi

        pnpm install --frozen-lockfile --lockfile-only

    - name: Collect update records
      id: collect_updates
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-after.json"

        updates_file="$RUNNER_TEMP/pnpm-updates.tsv"
        node "$GITHUB_ACTION_PATH/scripts/diff-dependency-ranges.js" \
          "$RUNNER_TEMP/pnpm-ranges-before.json" \
          "$RUNNER_TEMP/pnpm-ranges-after.json" > "$updates_file"

        while IFS=$'\t' read -r pkg old_ver new_ver; do
          [ -z "$pkg" ] && continue
          echo "::notice::Updated $pkg from $old_ver to $new_ver"
        done < "$updates_file"

        if [ -s "$updates_file" ]; then
          echo "has_updates=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No package updates available"
        fi

    - name: Build PR description
      id: build_pr_body
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        HAS_UPDATES: ${{ steps.collect_updates.outputs.has_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../shared/build_update_pr_body.py
      run: |
        empty_message=""
        if [ "$HAS_UPDATES" != "true" ]; then
          empty_message="Regenerated \`pnpm-lock.yaml\` without package version changes."
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# pnpm Dependencies Update" \
          --columns "Package,Old,New" \
          --updates-file "$RUNNER_TEMP/pnpm-updates.tsv" \
          --empty-message "$empty_message" \
          --footer ":robot: *This PR was automatically generated by the pnpm Dependencies Update action*"

    - name: Determine files to commit
      id: files
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        files="package.json pnpm-lock.yaml"
        if [ -f pnpm-workspace.yaml ]; then
          files="$files pnpm-workspace.yaml"
        fi
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Check for changes
      id: check_changes
      if: inputs.dry-run != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/check-changes@v1
      with:
        files: ${{ steps.files.outputs.files }}

    - name: Create Pull Request
      id: open-pr
      if: inputs.dry-run != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@v1
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: ${{ steps.files.outputs.files }}
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ steps.build_pr_body.outputs.pr_body }}

    - name: Auto-merge Pull Request
      if: inputs.dry-run != 'true' && inputs.auto-merge == 'true' && steps.open-pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@v1
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open-pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
