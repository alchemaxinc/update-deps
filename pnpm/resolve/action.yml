name: 'Resolve pnpm Dependency Updates'

description: 'Resolve pnpm dependency updates in an already checked-out workspace without credentials'

inputs:
  excluded-packages:
    required: false
    description: 'Packages to exclude from updates, in a comma-separated list format'

  relock:
    required: false
    description: 'Whether pnpm-lock.yaml should be refreshed when no package versions change'
    default: 'false'

outputs:
  has_changes:
    description: 'Whether the resolution changed package files'
    value: ${{ steps.create_patch.outputs.has_changes }}

  patch_file:
    description: 'Absolute path to a patch containing only the dependency changes'
    value: ${{ steps.create_patch.outputs.patch_file }}

  files:
    description: 'Newline-separated package files included in the dependency patch'
    value: ${{ steps.create_patch.outputs.files }}

  pr_body:
    description: 'JSON-encoded pull request body for the resolved updates'
    value: ${{ steps.build_pr_body.outputs.pr_body }}

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: '.nvmrc'

    - name: Snapshot current dependency ranges
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-before.json"

    - name: Update dependencies
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
        RELOCK: ${{ inputs.relock }}
      run: |
        args=()
        IFS=',' read -ra excluded <<< "$EXCLUDED_PACKAGES"
        for pkg in "${excluded[@]}"; do
          pkg=$(echo "$pkg" | xargs)
          [ -z "$pkg" ] && continue
          args+=("!$pkg")
        done

        if [ "${#args[@]}" -gt 0 ]; then
          pnpm update --latest --ignore-scripts '*' "${args[@]}"
        else
          pnpm update --latest --ignore-scripts
        fi

        if [ "$RELOCK" = "true" ]; then
          # Keep existing optional dependencies for other platforms. A fresh
          # lockfile generated on one runner can omit them.
          pnpm install --ignore-scripts --no-frozen-lockfile
        fi

        pnpm install --ignore-scripts --frozen-lockfile

    - name: Collect update records
      id: collect_updates
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/../scripts/dependency-ranges.js" \
          package.json > "$RUNNER_TEMP/pnpm-ranges-after.json"

        updates_file="$RUNNER_TEMP/pnpm-updates.json"
        node - "$RUNNER_TEMP/pnpm-ranges-before.json" \
          "$RUNNER_TEMP/pnpm-ranges-after.json" > "$updates_file" <<'NODE'
        const fs = require("fs");
        const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
        const after = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
        const updates = Object.keys(before)
          .filter(name => Object.hasOwn(after, name) && after[name] !== before[name])
          .sort()
          .map(name => [name, before[name], after[name]]);
        process.stdout.write(JSON.stringify(updates));
        NODE

        node - "$updates_file" <<'NODE'
        const fs = require("fs");
        for (const [pkg, oldVersion, newVersion] of JSON.parse(fs.readFileSync(process.argv[2], "utf8"))) {
          console.log(`::notice::Updated ${pkg} from ${oldVersion} to ${newVersion}`);
        }
        NODE

        if [ "$(cat "$updates_file")" != "[]" ]; then
          echo "has_updates=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No updates available"
        fi

    - name: Build PR description
      id: build_pr_body
      shell: bash
      env:
        HAS_UPDATES: ${{ steps.collect_updates.outputs.has_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../../shared/build_update_pr_body.py
      run: |
        empty_message=""
        if [ "$HAS_UPDATES" != "true" ]; then
          empty_message="Regenerated \`pnpm-lock.yaml\` without package version changes."
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# pnpm Dependencies Update" \
          --columns "Package,Old,New" \
          --updates-file "$RUNNER_TEMP/pnpm-updates.json" \
          --empty-message "$empty_message" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/pnpm"

    - name: Create dependency patch
      id: create_patch
      shell: bash
      run: |
        files=(package.json pnpm-lock.yaml pnpm-workspace.yaml)
        for file in "${files[@]}"; do
          if ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1 && [ -e "$file" ]; then
            git add --intent-to-add -- "$file"
          fi
        done

        patch_file="$RUNNER_TEMP/pnpm-dependency-update.patch"
        git diff --binary HEAD -- "${files[@]}" > "$patch_file"
        if [ -s "$patch_file" ]; then
          mapfile -t changed_files < <(git diff --name-only HEAD -- "${files[@]}")
          {
            echo "has_changes=true"
            echo "patch_file=$patch_file"
            echo "files<<EOF"
            printf '%s\n' "${changed_files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
