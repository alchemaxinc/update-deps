name: 'Update NPM Dependencies (Legacy)'

description: 'DEPRECATED: combined NPM update and PR action; use npm/resolve and npm/create-pr for credential isolation'

inputs:
  token:
    required: false
    description: 'GitHub token'
    default: ${{ github.token }}

  base-branch:
    required: false
    description: 'Base branch for PR'
    default: 'main'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-dependencies'

  pr-title:
    required: false
    description: 'Title for the pull request'
    default: 'Update NPM Dependencies'

  commit-message:
    required: false
    description: 'The commit message for the update'
    default: 'Update NPM dependencies'

  excluded-packages:
    required: false
    description: 'Packages to exclude from updates, in a comma-separated list format'

  npm-check-updates-version:
    required: false
    description: 'Exact npm-check-updates version to install'
    default: '23.0.1'

  relock:
    required: false
    description: 'Whether package-lock.json should be regenerated, even if no other updates are available'
    default: 'false'

  app-slug:
    required: false
    description: 'GitHub App slug for commit attribution (e.g., my-app). If provided, configures git as the app bot'
    default: ''

  auto-merge:
    required: false
    description: 'Whether a successful PR should be automatically merged'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method to use when auto-merging the PR. Must be one of: merge, squash, rebase. Used when auto-merge is enabled.'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Skip creating a new PR if an open PR with the same title already exists on the base branch'
    default: 'false'

  dry-run:
    required: false
    description: 'Test mode: skips checkout and PR creation but updates a pre-checked-out working tree; use npm/resolve instead'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Warn about legacy credential boundary
      shell: bash
      run: |
        echo "::warning::This legacy action resolves dependencies and creates a PR in one job. It is not credential-isolated. Use npm/resolve in an unprivileged job and npm/create-pr in a separate privileged job."

    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@v1
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Checkout and setup
      if: inputs.dry-run != 'true'
      uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
      with:
        token: ${{ inputs.token }}
        app-slug: ${{ inputs.app-slug }}

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.dry-run != 'true' && inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@v1
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Setup Node.js
      if: steps.check_existing_pr.outputs.exists != 'true'
      uses: actions/setup-node@v7
      with:
        cache: 'npm'
        node-version-file: '.nvmrc'

    - name: Cache npm-check-updates
      if: steps.check_existing_pr.outputs.exists != 'true'
      id: cache-ncu
      uses: actions/cache@v6
      with:
        path: ~/.npm-global
        key: npm-ncu-${{ runner.os }}-${{ inputs.npm-check-updates-version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-ncu-${{ runner.os }}-${{ inputs.npm-check-updates-version }}-

    - name: Install npm-check-updates
      if: steps.cache-ncu.outputs.cache-hit != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      run: |
        npm config set prefix '~/.npm-global'
        export PATH=~/.npm-global/bin:$PATH
        npm install -g --ignore-scripts npm-check-updates@${{ inputs.npm-check-updates-version }}

    - name: Check for available updates
      id: check_updates
      if: steps.check_existing_pr.outputs.exists != 'true'
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
        RELOCK: ${{ inputs.relock }}
      run: |
        export PATH=~/.npm-global/bin:$PATH
        cp package.json "$RUNNER_TEMP/npm-package-before.json"
        updates_json="$RUNNER_TEMP/npm-updates.json"
        if ! ncu --jsonUpgraded --reject "$EXCLUDED_PACKAGES" > "$updates_json"; then
          echo "::error::npm-check-updates failed while resolving package updates"
          exit 1
        fi

        if ! node -e 'const fs = require("fs"); process.exit(Object.keys(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))).length ? 0 : 1)' "$updates_json"; then
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          if [ "$RELOCK" = "true" ]; then
            echo "::notice::No package updates available; relocking package-lock.json"
            echo "should_install=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No updates available, stopping"
            echo "should_install=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        echo "has_updates=true" >> "$GITHUB_OUTPUT"
        echo "should_install=true" >> "$GITHUB_OUTPUT"

    - name: Apply updates to package.json
      if: steps.check_updates.outputs.has_updates == 'true'
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
      run: |
        export PATH=~/.npm-global/bin:$PATH
        ncu -u --reject "$EXCLUDED_PACKAGES"

    - name: Collect update records
      id: collect_updates
      if: steps.check_updates.outputs.has_updates == 'true'
      shell: bash
      run: |
        updates_file="$RUNNER_TEMP/npm-updates.json"
        node - "$RUNNER_TEMP/npm-package-before.json" package.json > "$updates_file" <<'NODE'
        const fs = require("fs");
        const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
        const after = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
        const sections = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
        const beforeVersions = Object.assign({}, ...sections.map(section => before[section] || {}));
        const afterVersions = Object.assign({}, ...sections.map(section => after[section] || {}));
        const updates = [];
        for (const name of Object.keys(afterVersions).sort()) {
          if (beforeVersions[name] && beforeVersions[name] !== afterVersions[name]) {
            updates.push([name, beforeVersions[name], afterVersions[name]]);
          }
        }
        process.stdout.write(JSON.stringify(updates));
        NODE

        node - "$updates_file" <<'NODE'
        const fs = require("fs");
        for (const [pkg, oldVersion, newVersion] of JSON.parse(fs.readFileSync(process.argv[2], "utf8"))) {
          console.log(`::notice::Updated ${pkg} from ${oldVersion} to ${newVersion}`);
        }
        NODE

    - name: Build PR description
      id: build_pr_body
      if: steps.check_updates.outputs.should_install == 'true'
      shell: bash
      env:
        HAS_UPDATES: ${{ steps.check_updates.outputs.has_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../shared/build_update_pr_body.py
      run: |
        updates_file="$RUNNER_TEMP/npm-updates.json"
        empty_message=""
        if [ "$HAS_UPDATES" != "true" ]; then
          empty_message="Regenerated \`package-lock.json\` without package version changes."
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# NPM Dependencies Update" \
          --columns "Package,Old,New" \
          --updates-file "$updates_file" \
          --empty-message "$empty_message" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/npm"

    - name: Install updated dependencies
      if: steps.check_updates.outputs.should_install == 'true'
      shell: bash
      env:
        RELOCK: ${{ inputs.relock }}
      run: |
        if [ "$RELOCK" = "true" ]; then
          rm -f package-lock.json
        fi
        npm install --ignore-scripts

    - name: Check for changes
      id: check_changes
      if: inputs.dry-run != 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/check-changes@v1
      with:
        files: 'package.json package-lock.json'

    - name: Create Pull Request
      id: open-pr
      if: inputs.dry-run != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@v1
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: 'package.json package-lock.json'
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ fromJSON(steps.build_pr_body.outputs.pr_body) }}

    - name: Auto-merge Pull Request
      if: inputs.dry-run != 'true' && inputs.auto-merge == 'true' && steps.open-pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@v1
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open-pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
