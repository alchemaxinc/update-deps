name: 'Resolve NPM Dependency Updates'

description: 'Resolve NPM dependency updates in an already checked-out workspace without credentials'

inputs:
  excluded-packages:
    required: false
    description: 'Packages to exclude from updates, in a comma-separated list format'

  npm-check-updates-version:
    required: false
    description: 'Exact npm-check-updates version to install'
    default: '23.0.1'

  relock:
    required: false
    description: 'Whether package-lock.json should be regenerated when no package versions change'
    default: 'false'

outputs:
  has_changes:
    description: 'Whether the resolution changed package.json or package-lock.json'
    value: ${{ steps.create_patch.outputs.has_changes }}

  patch_file:
    description: 'Absolute path to a patch containing only the dependency changes'
    value: ${{ steps.create_patch.outputs.patch_file }}

  files:
    description: 'Newline-separated package files included in the dependency patch'
    value: ${{ steps.create_patch.outputs.files }}

  pr_body:
    description: 'JSON-encoded pull request body for the resolved updates'
    value: ${{ steps.build_pr_body.outputs.pr_body }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: '.nvmrc'

    - name: Install npm-check-updates
      shell: bash
      run: |
        npm install --global --prefix "$RUNNER_TEMP/npm-global" \
          --ignore-scripts \
          npm-check-updates@${{ inputs.npm-check-updates-version }}

    - name: Check for available updates
      id: check_updates
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
        RELOCK: ${{ inputs.relock }}
      run: |
        export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
        cp package.json "$RUNNER_TEMP/npm-package-before.json"
        updates_json="$RUNNER_TEMP/npm-updates.json"
        if ! ncu --jsonUpgraded --reject "$EXCLUDED_PACKAGES" > "$updates_json"; then
          echo "::error::npm-check-updates failed while resolving package updates"
          exit 1
        fi

        if ! node -e 'const fs = require("fs"); process.exit(Object.keys(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))).length ? 0 : 1)' "$updates_json"; then
          echo "has_updates=false" >> "$GITHUB_OUTPUT"
          if [ "$RELOCK" = "true" ]; then
            echo "::notice::No package updates available; relocking package-lock.json"
            echo "should_install=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No updates available, stopping"
            echo "should_install=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        echo "has_updates=true" >> "$GITHUB_OUTPUT"
        echo "should_install=true" >> "$GITHUB_OUTPUT"

    - name: Apply updates to package.json
      if: steps.check_updates.outputs.has_updates == 'true'
      shell: bash
      env:
        EXCLUDED_PACKAGES: ${{ inputs.excluded-packages }}
      run: |
        export PATH="$RUNNER_TEMP/npm-global/bin:$PATH"
        ncu -u --reject "$EXCLUDED_PACKAGES"

    - name: Collect update records
      if: steps.check_updates.outputs.has_updates == 'true'
      shell: bash
      run: |
        updates_file="$RUNNER_TEMP/npm-updates.json"
        node - "$RUNNER_TEMP/npm-package-before.json" package.json > "$updates_file" <<'NODE'
        const fs = require("fs");
        const before = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
        const after = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
        const sections = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
        const beforeVersions = Object.assign({}, ...sections.map(section => before[section] || {}));
        const afterVersions = Object.assign({}, ...sections.map(section => after[section] || {}));
        const updates = [];
        for (const name of Object.keys(afterVersions).sort()) {
          if (beforeVersions[name] && beforeVersions[name] !== afterVersions[name]) {
            updates.push([name, beforeVersions[name], afterVersions[name]]);
          }
        }
        process.stdout.write(JSON.stringify(updates));
        NODE

        node - "$updates_file" <<'NODE'
        const fs = require("fs");
        for (const [pkg, oldVersion, newVersion] of JSON.parse(fs.readFileSync(process.argv[2], "utf8"))) {
          console.log(`::notice::Updated ${pkg} from ${oldVersion} to ${newVersion}`);
        }
        NODE

    - name: Build PR description
      id: build_pr_body
      if: steps.check_updates.outputs.should_install == 'true'
      shell: bash
      env:
        HAS_UPDATES: ${{ steps.check_updates.outputs.has_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../../shared/build_update_pr_body.py
      run: |
        updates_file="$RUNNER_TEMP/npm-updates.json"
        empty_message=""
        if [ "$HAS_UPDATES" != "true" ]; then
          empty_message="Regenerated \`package-lock.json\` without package version changes."
        fi

        python3 "$PR_BODY_SCRIPT" \
          --title "# NPM Dependencies Update" \
          --columns "Package,Old,New" \
          --updates-file "$updates_file" \
          --empty-message "$empty_message" \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/npm"

    - name: Install updated dependencies
      if: steps.check_updates.outputs.should_install == 'true'
      shell: bash
      env:
        RELOCK: ${{ inputs.relock }}
      run: |
        if [ "$RELOCK" = "true" ]; then
          rm -f package-lock.json
        fi
        npm install --ignore-scripts

    - name: Create dependency patch
      id: create_patch
      shell: bash
      run: |
        files=(package.json package-lock.json)
        for file in "${files[@]}"; do
          if ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1 && [ -e "$file" ]; then
            git add --intent-to-add -- "$file"
          fi
        done

        patch_file="$RUNNER_TEMP/npm-dependency-update.patch"
        git diff --binary HEAD -- "${files[@]}" > "$patch_file"
        if [ -s "$patch_file" ]; then
          mapfile -t changed_files < <(git diff --name-only HEAD -- "${files[@]}")
          {
            echo "has_changes=true"
            echo "patch_file=$patch_file"
            echo "files<<EOF"
            printf '%s\n' "${changed_files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
