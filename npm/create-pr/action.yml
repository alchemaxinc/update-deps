name: 'Create NPM Dependency Update Pull Request'

description: 'Create a pull request from an NPM dependency patch applied to the current workspace'

inputs:
  token:
    required: true
    description: 'GitHub token with contents: write and pull-requests: write permissions'

  base-branch:
    required: false
    description: 'Base branch for the pull request'
    default: 'main'

  branch-prefix:
    required: false
    description: 'Branch prefix'
    default: 'update-dependencies'

  pr-title:
    required: false
    description: 'Title for the pull request'
    default: 'Update NPM Dependencies'

  commit-message:
    required: false
    description: 'The commit message for the update'
    default: 'Update NPM dependencies'

  pr-body:
    required: true
    description: 'JSON-encoded pull request body emitted by npm/resolve'

  files:
    required: true
    description: 'Newline-separated package files included in the applied patch'

  auto-merge:
    required: false
    description: 'Whether a successful PR should be automatically merged'
    default: 'false'

  merge-method:
    required: false
    description: 'Merge method when auto-merging: merge, squash, or rebase'
    default: 'merge'

  skip-if-pr-exists:
    required: false
    description: 'Skip creating a PR if an open PR with this title exists on the base branch'
    default: 'false'

outputs:
  pr_number:
    description: 'Created pull request number'
    value: ${{ steps.open_pr.outputs.pr_number }}

runs:
  using: 'composite'
  steps:
    - name: Validate merge method
      uses: alchemaxinc/composite-toolbox/validate-merge-method@5000c1f31a895dfa69287e07b84136a3ac4efe77
      with:
        merge-method: ${{ inputs.merge-method }}

    - name: Configure Git author
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../../shared/configure_git_identity.sh"

    - name: Check for existing pull request
      id: check_existing_pr
      if: inputs.skip-if-pr-exists == 'true'
      uses: alchemaxinc/composite-toolbox/check-existing-pr@5000c1f31a895dfa69287e07b84136a3ac4efe77
      with:
        token: ${{ inputs.token }}
        pr-title: ${{ inputs.pr-title }}
        base-branch: ${{ inputs.base-branch }}

    - name: Check patched workspace for changes
      id: check_changes
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        mapfile -t files <<< "$FILES"
        for file in "${files[@]}"; do
          case "$file" in
            package.json|package-lock.json) ;;
            *)
              echo "::error::npm/create-pr only accepts package.json and package-lock.json"
              exit 1
              ;;
          esac
        done
        if git diff --quiet HEAD -- "${files[@]}"; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Pull Request
      id: open_pr
      if: steps.check_changes.outputs.has_changes == 'true' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/create-pr@5000c1f31a895dfa69287e07b84136a3ac4efe77
      with:
        token: ${{ inputs.token }}
        base-branch: ${{ inputs.base-branch }}
        branch-prefix: ${{ inputs.branch-prefix }}
        files: ${{ inputs.files }}
        commit-message: ${{ inputs.commit-message }}
        pr-title: ${{ inputs.pr-title }}
        pr-body: ${{ fromJSON(inputs.pr-body) }}

    - name: Auto-merge Pull Request
      if: inputs.auto-merge == 'true' && steps.open_pr.outcome == 'success' && steps.check_existing_pr.outputs.exists != 'true'
      uses: alchemaxinc/composite-toolbox/merge-pr@5000c1f31a895dfa69287e07b84136a3ac4efe77
      with:
        token: ${{ inputs.token }}
        pull-request-number: ${{ steps.open_pr.outputs.pr_number }}
        merge-method: ${{ inputs.merge-method }}
