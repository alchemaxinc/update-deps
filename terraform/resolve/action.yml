name: 'Resolve Terraform Provider Updates'

description: 'Update and validate Terraform providers in an already checked-out workspace without credentials'

inputs:
  working-dir:
    required: true
    description: 'Working directory for Terraform'

outputs:
  has_changes:
    description: 'Whether the resolution changed Terraform configuration or its provider lock file'
    value: ${{ steps.create_patch.outputs.has_changes }}

  patch_file:
    description: 'Absolute path to a patch containing only the Terraform dependency changes'
    value: ${{ steps.create_patch.outputs.patch_file }}

  files:
    description: 'Newline-separated Terraform files included in the dependency patch'
    value: ${{ steps.create_patch.outputs.files }}

  pr_body:
    description: 'JSON-encoded pull request body for the resolved updates'
    value: ${{ steps.build_pr_body.outputs.pr_body }}

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

    - name: Baseline initialization without a backend
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: terraform init -backend=false

    - name: Get current versions
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: terraform version -json > "$RUNNER_TEMP/terraform-versions.json"

    - name: Update Terraform dependencies
      id: update_deps
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIR: ${{ inputs.working-dir }}
      run: python3 "$ACTION_PATH/../scripts/update_provider_versions.py" "$WORKING_DIR" "$RUNNER_TEMP/terraform-versions.json"

    - name: Upgrade provider lock file without a backend
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: terraform init -backend=false -upgrade

    - name: Terraform validate
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: terraform validate

    - name: Terraform fmt
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      run: terraform fmt -recursive -write

    - name: Build PR description
      id: build_pr_body
      shell: bash
      env:
        PROVIDER_UPDATES: ${{ steps.update_deps.outputs.provider_updates }}
        PR_BODY_SCRIPT: ${{ github.action_path }}/../../shared/build_update_pr_body.py
      run: |
        updates_file="$RUNNER_TEMP/terraform-updates.json"
        printf "%s" "$PROVIDER_UPDATES" | python3 -c '
        import json
        import sys

        json.dump(
            [line.split("\t") for line in sys.stdin.read().splitlines() if line],
            sys.stdout,
        )
        ' > "$updates_file"

        python3 "$PR_BODY_SCRIPT" \
          --title "# Terraform Dependencies Update" \
          --columns "Provider,Old,New,File" \
          --updates-file "$updates_file" \
          --empty-message "Regenerated \`.terraform.lock.hcl\` without provider constraint changes." \
          --source-url "https://github.com/alchemaxinc/update-deps/tree/main/terraform"

    - name: Create dependency patch
      id: create_patch
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        working_dir="${WORKING_DIR#./}"
        working_dir="${working_dir%/}"
        if [ "$working_dir" = "." ]; then
          working_dir=""
        fi
        prefix="${working_dir:+$working_dir/}"

        mapfile -t files < <(
          {
            git diff --name-only HEAD -- "$WORKING_DIR"
            git ls-files --others --exclude-standard -- "$WORKING_DIR"
          } | sort -u | while IFS= read -r file; do
            case "$file" in
              "$prefix"*.tf|"$prefix"*.tf.json|"$prefix".terraform.lock.hcl)
                if [[ "$file" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$file" != -* ]]; then
                  echo "$file"
                else
                  echo "::warning::Skipping unsafe Terraform path: $file" >&2
                fi
                ;;
            esac
          done
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        for file in "${files[@]}"; do
          if ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1 && [ -e "$file" ]; then
            git add --intent-to-add -- "$file"
          fi
        done

        patch_file="$RUNNER_TEMP/terraform-dependency-update.patch"
        git diff --binary HEAD -- "${files[@]}" > "$patch_file"
        if [ -s "$patch_file" ]; then
          {
            echo "has_changes=true"
            echo "patch_file=$patch_file"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
