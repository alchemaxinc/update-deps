name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  CSPELL_VERSION: '8.0.0'
  BLACK_VERSION: '24.10.0'
  RUFF_VERSION: '0.12.7'
  ACTIONLINT_VERSION: '1.7.12'
  SHELLCHECK_VERSION: '0.10.0'
  PRETTIER_VERSION: '3.3.3'
  COMMITLINT_CLI_VERSION: '20.2.0'

jobs:
  install-commitlint:
    runs-on: ubuntu-latest
    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@v7

      - &cache-commitlint
        name: Cache Commitlint
        id: cache-commitlint
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v4-commitlint-${{ env.COMMITLINT_CLI_VERSION }}

      - name: Install Commitlint
        if: steps.cache-commitlint.outputs.cache-hit != 'true'
        run: npm i -D @commitlint/cli@${{ env.COMMITLINT_CLI_VERSION }} @commitlint/config-conventional

  run-commitlint:
    runs-on: ubuntu-latest
    needs: install-commitlint
    steps:
      - name: Checkout code (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - *cache-commitlint

      - name: Run commitlint
        run: |
          git checkout main
          git checkout -
          ./node_modules/.bin/commitlint --from main --to HEAD --verbose

  install-prettier:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - &cache-prettier
        name: Cache Prettier
        id: cache-prettier
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v1-prettier-${{ env.PRETTIER_VERSION }}

      - name: Install Prettier
        if: steps.cache-prettier.outputs.cache-hit != 'true'
        run: npm i -D prettier@${{ env.PRETTIER_VERSION }}

  run-prettier:
    runs-on: ubuntu-latest
    needs: install-prettier
    steps:
      - *checkout-code
      - *cache-prettier

      - name: Run Prettier check
        run: ./node_modules/.bin/prettier --check .

  run-black:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Cache Black
        uses: actions/cache@v6
        id: cache-black
        with:
          path: ~/.cache/ci-tools/black/${{ env.BLACK_VERSION }}
          key: v1-black-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-${{ env.BLACK_VERSION }}

      - name: Install Black
        if: steps.cache-black.outputs.cache-hit != 'true'
        run: |
          BLACK_HOME="$HOME/.cache/ci-tools/black/${{ env.BLACK_VERSION }}"
          python -m venv "$BLACK_HOME"
          "$BLACK_HOME/bin/pip" install black==${{ env.BLACK_VERSION }}

      - name: Add Black to PATH
        run: echo "$HOME/.cache/ci-tools/black/${{ env.BLACK_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Run Black check
        run: black --check .

  run-ruff:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Cache Ruff
        uses: actions/cache@v6
        id: cache-ruff
        with:
          path: ~/.cache/ci-tools/ruff/${{ env.RUFF_VERSION }}
          key: v1-ruff-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-${{ env.RUFF_VERSION }}

      - name: Install Ruff
        if: steps.cache-ruff.outputs.cache-hit != 'true'
        run: |
          RUFF_HOME="$HOME/.cache/ci-tools/ruff/${{ env.RUFF_VERSION }}"
          python -m venv "$RUFF_HOME"
          "$RUFF_HOME/bin/pip" install ruff==${{ env.RUFF_VERSION }}

      - name: Add Ruff to PATH
        run: echo "$HOME/.cache/ci-tools/ruff/${{ env.RUFF_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Run Ruff correctness checks
        run: ruff check .

  run-actionlint:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Cache Actionlint
        id: cache-actionlint
        uses: actions/cache@v6
        with:
          path: ~/.cache/ci-tools/actionlint/${{ env.ACTIONLINT_VERSION }}
          key: v1-actionlint-${{ runner.os }}-${{ runner.arch }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install Actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$HOME/.cache/ci-tools/actionlint/$VERSION"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint

      - name: Add Actionlint to PATH
        run: echo "$HOME/.cache/ci-tools/actionlint/${{ env.ACTIONLINT_VERSION }}" >> "$GITHUB_PATH"

      - name: Run Actionlint
        run: |
          actionlint -color \
            -ignore 'element of "steps" section is alias node' \
            -ignore 'step must run script with "run" section or run action with "uses" section'

  run-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Cache ShellCheck
        id: cache-shellcheck
        uses: actions/cache@v6
        with:
          path: ~/.cache/ci-tools/shellcheck/${{ env.SHELLCHECK_VERSION }}
          key: v1-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.SHELLCHECK_VERSION }}

      - name: Install ShellCheck
        if: steps.cache-shellcheck.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          install_dir="$HOME/.cache/ci-tools/shellcheck/$VERSION"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz" \
            --output "$archive"
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1

      - name: Add ShellCheck to PATH
        run: echo "$HOME/.cache/ci-tools/shellcheck/${{ env.SHELLCHECK_VERSION }}" >> "$GITHUB_PATH"

      - name: Run ShellCheck
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck

  install-cspell:
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - &cache-cspell
        name: Cache CSpell
        id: cache-cspell
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v1-cspell-${{ env.CSPELL_VERSION }}

      - name: Install CSpell
        if: steps.cache-cspell.outputs.cache-hit != 'true'
        run: npm i -D cspell@${{ env.CSPELL_VERSION }}

  run-cspell:
    runs-on: ubuntu-latest
    needs: install-cspell
    steps:
      - *checkout-code
      - *cache-cspell

      - name: Run CSpell check
        run: ./node_modules/.bin/cspell

  python-unit-tests:
    name: Python Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: GitHub Actions
            directory: actions
            has-requirements: true
          - name: Terraform
            directory: terraform
            has-requirements: false
          - name: Cargo
            directory: cargo
            has-requirements: false
          - name: Docker
            directory: docker
            has-requirements: true
          - name: Shared Scripts
            directory: shared
            has-requirements: false
    steps:
      - *checkout-code

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            actions/requirements.txt
            docker/requirements.txt

      - name: Install dependencies
        if: matrix.has-requirements
        working-directory: ${{ matrix.directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ${{ matrix.directory }}
        run: python -m unittest discover -s . -p "test_*.py" -v

  test-actions:
    name: Test GitHub Actions Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Test actions updater
        uses: ./actions
        with:
          dry-run: 'true'
          base-branch: main
          file-glob: 'actions/test/.github/**/*.yml'

      - name: Verify action fixture
        run: bash actions/test/verify-dry-run.sh

  test-circleci-orbs:
    name: Test CircleCI Orbs Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Test CircleCI orb action configuration
        working-directory: circleci-orbs
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test CircleCI orbs updater
        uses: ./circleci-orbs
        with:
          dry-run: 'true'
          base-branch: main
          circleci-config-file: 'circleci-orbs/test/.circleci/config.yml'

      - name: Verify CircleCI fixture
        run: bash circleci-orbs/test/verify-dry-run.sh

  test-golang:
    name: Test Go Dependencies Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup test fixtures
        run: |
          cp golang/test/go.mod .
          cp golang/test/go.sum .

      - name: Test Go dependencies updater
        uses: ./golang
        with:
          dry-run: 'true'
          base-branch: main

      - name: Verify Go fixture
        run: bash golang/test/verify-update.sh

  test-npm:
    name: Test NPM Dependencies Updater
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout-code

      - name: Setup test fixtures
        run: |
          cp npm/test/package.json .
          cp npm/test/package-lock.json .
          cp npm/test/.nvmrc .

      - name: Test NPM dependencies updater
        uses: ./npm
        with:
          dry-run: 'true'
          base-branch: main

      - name: Verify NPM fixture
        run: bash npm/test/verify-update.sh

  test-pnpm:
    name: Test pnpm Dependencies Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup test fixtures
        run: |
          cp pnpm/test/package.json .
          cp pnpm/test/pnpm-lock.yaml .
          cp pnpm/test/.nvmrc .

      - name: Test pnpm dependencies updater
        uses: ./pnpm
        with:
          dry-run: 'true'
          base-branch: main

      - name: Verify pnpm fixture
        run: bash pnpm/test/verify-update.sh

  test-cargo:
    name: Test Cargo Dependencies Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup test fixtures
        run: |
          cp cargo/test/rust-toolchain.toml .
          cp -r cargo/test/wrapper .

      - name: Test Cargo dependencies updater
        uses: ./cargo
        with:
          dry-run: 'true'
          base-branch: main

      - name: Verify Cargo fixture
        run: bash cargo/test/verify-update.sh

  test-terraform:
    name: Test Terraform Dependencies Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Test Terraform dependencies updater
        uses: ./terraform
        with:
          dry-run: 'true'
          base-branch: main
          working-dir: 'terraform/test'
          var-file-path: 'test.tfvars'

      - name: Verify Terraform fixture
        run: bash terraform/test/verify-update.sh

  test-docker:
    name: Test Docker Images Updater
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup test fixtures
        run: |
          cp docker/test/Dockerfile .
          cp docker/test/docker-compose.yml .

      - name: Test Docker images updater
        uses: ./docker
        with:
          dry-run: 'true'
          base-branch: main

      - name: Verify Docker fixture
        run: bash docker/test/verify-dry-run.sh

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - run-commitlint
      - run-prettier
      - run-black
      - run-ruff
      - run-actionlint
      - run-shellcheck
      - run-cspell
      - python-unit-tests
      - test-actions
      - test-circleci-orbs
      - test-golang
      - test-npm
      - test-pnpm
      - test-cargo
      - test-terraform
      - test-docker
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          results=(
            "${{ needs.run-commitlint.result }}"
            "${{ needs.run-prettier.result }}"
            "${{ needs.run-black.result }}"
            "${{ needs.run-ruff.result }}"
            "${{ needs.run-actionlint.result }}"
            "${{ needs.run-shellcheck.result }}"
            "${{ needs.run-cspell.result }}"
            "${{ needs.python-unit-tests.result }}"
            "${{ needs.test-actions.result }}"
            "${{ needs.test-circleci-orbs.result }}"
            "${{ needs.test-golang.result }}"
            "${{ needs.test-npm.result }}"
            "${{ needs.test-pnpm.result }}"
            "${{ needs.test-cargo.result }}"
            "${{ needs.test-terraform.result }}"
            "${{ needs.test-docker.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
