name: Semantic Versioning and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  semantic-release:
    name: Semantic Versioning and Release
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: write

    env:
      SEMANTIC_RELEASE_VERSION: '25.0.8'
      SEMANTIC_RELEASE_COMMIT_ANALYZER_VERSION: '13.0.1'
      SEMANTIC_RELEASE_RELEASE_NOTES_GENERATOR_VERSION: '14.1.1'
      SEMANTIC_RELEASE_NPM_VERSION: '13.1.5'
      SEMANTIC_RELEASE_GITHUB_VERSION: '12.0.9'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.10.0'

      - name: Cache release tooling
        id: cache-semantic-release
        uses: actions/cache@v6
        with:
          path: ~/.npm-semantic-release
          key: semantic-release-${{ runner.os }}-${{ env.SEMANTIC_RELEASE_VERSION }}-${{ env.SEMANTIC_RELEASE_COMMIT_ANALYZER_VERSION }}-${{ env.SEMANTIC_RELEASE_RELEASE_NOTES_GENERATOR_VERSION }}-${{ env.SEMANTIC_RELEASE_NPM_VERSION }}-${{ env.SEMANTIC_RELEASE_GITHUB_VERSION }}

      - name: Install release tooling
        if: steps.cache-semantic-release.outputs.cache-hit != 'true'
        run: |
          npm install --global --prefix "$HOME/.npm-semantic-release" --ignore-scripts \
            semantic-release@${{ env.SEMANTIC_RELEASE_VERSION }} \
            @semantic-release/commit-analyzer@${{ env.SEMANTIC_RELEASE_COMMIT_ANALYZER_VERSION }} \
            @semantic-release/release-notes-generator@${{ env.SEMANTIC_RELEASE_RELEASE_NOTES_GENERATOR_VERSION }} \
            @semantic-release/npm@${{ env.SEMANTIC_RELEASE_NPM_VERSION }} \
            @semantic-release/github@${{ env.SEMANTIC_RELEASE_GITHUB_VERSION }}

      - name: Add release tooling to PATH
        run: echo "$HOME/.npm-semantic-release/bin" >> "$GITHUB_PATH"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: semantic-release

  semantic-release-flowing-tags:
    name: Add flowing tags
    runs-on: ubuntu-latest
    needs: semantic-release
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: latest-tag
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Is tag semantic?
        id: is-tag-semantic
        if: steps.latest-tag.outputs.tag != ''
        run: |
          TAG="${{ steps.latest-tag.outputs.tag }}"

          # Skip the tag if it does not match the semantic version pattern.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::debug::Tag $TAG does not match the semantic version pattern. Skip moving tags."
            echo "semantic=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "semantic=true" >> $GITHUB_OUTPUT
          echo "semantic-tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract version tag
        id: major-minor-tags
        if: ${{ steps.is-tag-semantic.outputs.semantic == 'true' }}
        run: |
          TAG="${{ steps.is-tag-semantic.outputs.semantic-tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          echo "::debug::Tag $TAG has MAJOR=$MAJOR and MINOR=$MINOR"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Push major tag
        id: push-major
        if: ${{ steps.is-tag-semantic.outputs.semantic == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.is-tag-semantic.outputs.semantic-tag }}"
          MAJOR="${{ steps.major-minor-tags.outputs.major }}"
          MAJOR_TAG="v$MAJOR"
          echo "::debug::The action points tag $MAJOR_TAG to $TAG"
          git tag -f "$MAJOR_TAG" "$TAG"
          git push origin "$MAJOR_TAG" --force

      - name: Push minor tag
        id: push-minor
        if: ${{ steps.is-tag-semantic.outputs.semantic == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.is-tag-semantic.outputs.semantic-tag }}"
          MAJOR="${{ steps.major-minor-tags.outputs.major }}"
          MINOR="${{ steps.major-minor-tags.outputs.minor }}"
          MINOR_TAG="v$MAJOR.$MINOR"
          echo "::debug::The action points tag $MINOR_TAG to $TAG"
          git tag -f "$MINOR_TAG" "$TAG"
          git push origin "$MINOR_TAG" --force
