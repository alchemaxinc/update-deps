name: Update Tags in Documentation

on:
  workflow_run:
    workflows: ['Semantic Versioning and Release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for documentation updates, for example v1.10.2.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation Tags
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          shallow: 'false'
          token: ${{ steps.app.outputs.token }}

      - name: Determine tag
        id: get-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            git fetch --tags
            TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "")
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No tag found"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Tag '$TAG' is not a full semantic version. Skip it."
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync tags in documentation
        id: sync-tags
        if: steps.get-tag.outputs.tag != ''
        uses: alchemaxinc/composite-toolbox/sync-tags-in-docs@v1
        with:
          file-extensions: '.md'
          github-repo-path: 'alchemaxinc/update-deps'
          current-tag: ${{ steps.get-tag.outputs.tag }}

      - name: Format updated files list
        id: format-files
        if: steps.sync-tags.outputs.files_updated != ''
        env:
          FILES_UPDATED: ${{ steps.sync-tags.outputs.files_updated }}
        run: |
          {
            echo 'files_list<<EOF'
            read -r -a files <<< "$FILES_UPDATED"
            for file in "${files[@]}"; do
              echo "- \`$file\`"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        if: steps.sync-tags.outputs.files_updated != ''
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: 'main'
          branch-prefix: 'update-docs-tags'
          files: ${{ steps.sync-tags.outputs.files_updated }}
          commit-message: 'docs: update action tags to ${{ steps.get-tag.outputs.tag }}'
          pr-title: 'docs: update action tags to ${{ steps.get-tag.outputs.tag }}'
          pr-body: |
            Updates GitHub Action tags in documentation files to the latest release.

            **New tag**: `${{ steps.get-tag.outputs.tag }}`

            **Files updated**:
            ${{ steps.format-files.outputs.files_list }}

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_number != ''
        uses: alchemaxinc/composite-toolbox/merge-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pr_number }}
          merge-method: 'squash'
